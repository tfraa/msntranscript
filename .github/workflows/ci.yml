name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff mypy
      - name: ruff check
        run: ruff check msnpip tests
      - name: ruff format --check
        run: ruff format --check msnpip tests
      - name: mypy
        run: mypy msnpip || true   # type-checking is advisory until strict mode is enabled

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache neuromaps surface assets
        uses: actions/cache@v4
        with:
          path: ~/neuromaps-data
          key: neuromaps-fsaverage-v1
      - name: Install (engine resolves from pinned git SHA)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pre-warm surface assets (so the figures stage renders + is covered)
        run: |
          python -c "import imaging_transcriptomics.outputs.brain as b; getattr(b,'fetch_standard_surface_meshes',lambda: None)()" || true
      - name: Unit + integration tests (engine mocked)
        env:
          MPLBACKEND: Agg
        run: pytest -m "not slow" --cov=msnpip --cov-report=term-missing --cov-fail-under=85

  test-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache neuromaps surface assets
        uses: actions/cache@v4
        with:
          path: ~/neuromaps-data
          key: neuromaps-fsaverage-v1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pre-warm surface assets
        run: |
          python -c "import imaging_transcriptomics.outputs.brain as b; getattr(b,'fetch_standard_surface_meshes',lambda: None)()" || true
      - name: Real-engine slow tests
        env:
          MPLBACKEND: Agg
        run: pytest -m slow

  build-image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t msnpip:ci .
      - name: Smoke run (image + engine import)
        run: docker run --rm msnpip:ci list-atlases
