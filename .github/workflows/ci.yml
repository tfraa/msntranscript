name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC — real-engine slow suite
  workflow_dispatch: {} # allow manual runs (incl. the slow suite)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin ruff so CI matches the pre-commit hook exactly (avoids format/lint
      # drift where a newer ruff reformats or adds rules only CI sees).
      - run: python -m pip install --upgrade pip "ruff==0.15.18"
      - name: ruff check
        run: ruff check msnpip tests
      - name: ruff format --check
        run: ruff format --check msnpip tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache neuromaps surface assets
        uses: actions/cache@v4
        with:
          path: ~/neuromaps-data
          key: neuromaps-fsaverage-v1
      - name: Install (engine resolves from pinned git SHA; constraints pin the known-good set)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt
      - name: mypy (type gate)
        run: mypy msnpip
      - name: Pre-warm surface assets (so the figures stage renders + is covered)
        run: |
          python -c "import imaging_transcriptomics.outputs.brain as b; getattr(b,'fetch_standard_surface_meshes',lambda: None)()" || true
      - name: Unit + integration tests (engine mocked)
        env:
          MPLBACKEND: Agg
        run: pytest -m "not slow" --cov=msnpip --cov-report=term-missing --cov-fail-under=85

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      # Advisory: surfaces known CVEs in the locked runtime set without blocking
      # PRs on upstream vulns we can't immediately patch (the engine is git-pinned).
      - name: pip-audit (advisory)
        continue-on-error: true
        run: pip-audit -r constraints.txt --progress-spinner=off

  test-slow:
    # Heavy: pulls AHBA data + runs the real engine. Keep it off the per-PR path;
    # run nightly (schedule) and on demand (workflow_dispatch) instead.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache neuromaps surface assets
        uses: actions/cache@v4
        with:
          path: ~/neuromaps-data
          key: neuromaps-fsaverage-v1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt
      - name: Pre-warm surface assets
        run: |
          python -c "import imaging_transcriptomics.outputs.brain as b; getattr(b,'fetch_standard_surface_meshes',lambda: None)()" || true
      - name: Real-engine slow tests
        env:
          MPLBACKEND: Agg
        run: pytest -m slow

  build-image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t msnpip:ci .
      - name: Smoke run (image + engine import)
        run: docker run --rm msnpip:ci list-atlases
