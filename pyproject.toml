[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msnpip"
version = "2.0.0"
description = "Morphometric Similarity Network Imaging Transcriptomics Pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Francesco Tomasella" }]

dependencies = [
    # Engine pinned to commit e6a2c237 (v2.0.0, branch refactor-v2.0.0)
    "imaging-transcriptomics @ git+https://github.com/alegiac95/Imaging-transcriptomics@e6a2c237fc74a0b2072a6d58efaf9d1c22cc08e1",
    # Transitive engine deps — listed for clarity
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "nibabel>=5.2",
    "matplotlib>=3.8",
    "gseapy>=1.1.3",
    "neuromaps>=0.0.5",
    # msnpip-direct
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.0",
]

[project.optional-dependencies]
brainspace = ["brainspace>=0.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
msnpip = "msnpip.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["msnpip*"]

[tool.setuptools.package-data]
msnpip = ["genes/*.gmt", "data/*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["imaging_transcriptomics.*", "gseapy.*", "neuromaps.*", "nilearn.*", "nibabel.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires the real imaging-transcriptomics engine (deselect with -m 'not slow')",
]
addopts = "-ra -q"
